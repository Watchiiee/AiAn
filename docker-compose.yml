# 로컬에서 두 컨테이너를 한 번에 띄워 테스트하기 위한 구성.
# DB는 Supabase(외부 관리형)를 쓰므로 여기 별도 db 서비스는 없음 —
# backend는 .env의 DATABASE_URL로 Supabase에 직접 연결한다.
#
# FE는 절대URL 방식(브라우저가 백엔드 주소로 직접 요청)이라, 컨테이너
# 내부 서비스명(backend:8000)이 아니라 "브라우저 기준으로 접속 가능한
# 주소"(localhost:8000, 포트매핑 되어있으므로)를 빌드 시점에 넣어야 한다.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    # 서버 재부팅 시(이미지 복제 등) 컨테이너가 자동으로 다시 뜨게 함 —
    # Private 서브넷 백엔드에서 재부팅 후 컨테이너가 안 떠서 로드밸런서
    # Health Check가 TCP CLOSE로 실패했던 문제를 겪은 뒤 추가함.
    restart: unless-stopped
    # .env의 CORS_ALLOWED_ORIGINS에 아래 frontend 접속 주소(http://localhost)가
    # 포함되어 있어야 브라우저 요청이 CORS에 안 걸림. 기본값(5173/3000)에는
    # 없으므로 .env에 추가 필요:
    #   CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fe
      args:
        VITE_API_BASE: "http://101.79.24.9:8000"
    ports:
      - "80:80"
    depends_on:
      - backend