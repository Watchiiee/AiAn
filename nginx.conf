server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 대응: /staff, /login 같은 클라이언트 사이드 경로로 직접
    # 접속(새로고침 등)해도 404 대신 index.html을 돌려줘야 react-router가
    # 정상 동작한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 참고: FE가 백엔드를 절대URL로 직접 호출하는 구조(client.ts의 VITE_API_BASE
    # 방식)라서, 여기서 /api를 백엔드로 프록시하는 설정은 필요 없다 — 브라우저가
    # 백엔드 주소로 바로 요청을 보내고, CORS는 백엔드(BE/main.py, settings.
    # cors_allowed_origins)에서 허용한다.

    # 정적 자산 캐싱(js/css 등) - Vite가 파일명에 해시를 붙여 내놓으므로
    # 안전하게 오래 캐싱해도 됨
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}