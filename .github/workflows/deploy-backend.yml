name: Deploy Backend

# AI/BE 코드나 Docker 관련 파일이 바뀔 때만 실행 (FE만 바뀌면 이 워크플로는
# 안 도는게 정상 - 모노레포라서 경로 필터로 분리함)
on:
  push:
    branches: [main]
    paths:
      - "AI/**"
      - "BE/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"

jobs:
  deploy-backend-1:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into backend-1 via Bastion and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST_1 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Private 서브넷이라 Bastion을 거쳐야 접속 가능 (README 11.4절 참고)
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: root
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 임베딩 모델 다운로드 + ingest가 포함된 빌드라 시간이 걸림
          command_timeout: 30m
          script: |
            cd ~/AiAn
            git pull
            docker compose up --build -d --no-deps backend

  deploy-backend-2:
    runs-on: ubuntu-latest
    # backend-1 job과는 서로 의존관계가 없어 기본적으로 병렬 실행됨 -
    # 하나가 실패해도 다른 하나의 실행에는 영향 없음
    steps:
      - name: SSH into backend-2 via Bastion and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST_2 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: root
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/AiAn
            git pull
            docker compose up --build -d --no-deps backend